name: Full manuscript diagnostic review

on:
  push:
    paths:
      - 'review_full.py'
      - '.github/workflows/review.yml'
  workflow_dispatch:
    inputs:
      budget_usd:
        description: Cumulative OpenRouter spending ceiling (USD)
        required: true
        default: '7.75'

permissions:
  contents: read

concurrency:
  group: manuscript-full-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Verify configuration and manuscript
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$OPENROUTER_API_KEY" || { echo "Missing OPENROUTER_API_KEY secret"; exit 1; }
          test -s input/manuscript.docx || { echo "Missing input/manuscript.docx"; exit 1; }
          python3 -m py_compile review_run.py review_full.py

      - name: Whole-manuscript MAX reasoning review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BUDGET_USD: ${{ inputs.budget_usd || '7.75' }}
        run: |
          python3 -u review_full.py \
            --file input/manuscript.docx \
            --out results \
            --budget "$BUDGET_USD"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-manuscript-review-${{ github.run_number }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14
