name: Internal model experiment

on:
  push:
    paths:
      - 'input/manuscript.docx'
  workflow_dispatch:
    inputs:
      budget_usd:
        description: Maximum OpenRouter spend for this run (USD)
        required: true
        default: '7.75'
      words_per_batch:
        description: Words per diagnostic batch
        required: true
        default: '750'
      start_batch:
        description: First diagnostic batch to process
        required: true
        default: '1'

permissions:
  contents: read

concurrency:
  group: internal-model-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check privacy
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            echo "Set the repository to private before running this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Verify configuration and input
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$OPENROUTER_API_KEY" || { echo "Missing OPENROUTER_API_KEY secret"; exit 1; }
          test -s input/manuscript.docx || { echo "Upload the DOCX as input/manuscript.docx"; exit 1; }

      - name: Run section-by-section diagnostic review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BUDGET_USD: ${{ inputs.budget_usd || '7.75' }}
          WORDS_PER_BATCH: ${{ inputs.words_per_batch || '750' }}
          START_BATCH: ${{ inputs.start_batch || '1' }}
        run: |
          python3 review_run.py \
            --file input/manuscript.docx \
            --out results \
            --budget "$BUDGET_USD" \
            --words-per-batch "$WORDS_PER_BATCH" \
            --start-batch "$START_BATCH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-review-${{ github.run_number }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14
